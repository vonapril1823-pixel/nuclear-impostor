name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/android

      - name: Prepare web folder
        run: |
          mkdir www
          cp -r index.html faces.js favicon.ico manifest.webmanifest sw.js faces icons vendor www/
          node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f));c.webDir='www';fs.writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Add Android and sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nuclear-impostor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
